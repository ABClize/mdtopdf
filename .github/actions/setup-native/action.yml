name: Platform fonts
description: Install the Linux font baseline used by PDF tests.
runs:
  using: composite
  steps:
    - name: Linux fonts and PDF inspection
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Bound mirror stalls and retry transient failures without hiding errors.
        apt_options=(
          -o Acquire::Retries=2
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
        )
        sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
        sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
          fontconfig poppler-utils fonts-dejavu-core fonts-liberation \
          fonts-noto-cjk fonts-noto-color-emoji fonts-stix
        if apt-cache show fonts-cascadia-code >/dev/null 2>&1; then
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends fonts-cascadia-code
        fi
        fc-cache -f
